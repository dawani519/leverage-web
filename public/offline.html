<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <title>You're offline</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #18181b; color: #f4f4f5; }
        main { max-width: 420px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.5rem; margin: 20px 0 8px; }
        p { color: #a1a1aa; line-height: 1.5; margin: 0 0 24px; }
        button { font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; cursor: pointer; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="" width="72" height="72">
        <h1>You're offline</h1>
        <p>Check your connection and try again. For your safety, payments and transactions need a live connection, so nothing has been changed.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
